<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AIW Inline</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      width: 100%;
      height: 100%;
      min-height: 100%;
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
  </style>
</head>
<body>
<script>
(function(){
  // читаем query: siteId, clientId, mode
  const p = new URLSearchParams(location.search);
  const siteId   = p.get("siteId") || "";
  const clientId = p.get("clientId") || "";
  const mode     = (p.get("mode") || "inline").toLowerCase();
  const parentOrigin = p.get("parentOrigin") || "*";
  const instanceId   = p.get("instanceId") || "";
  const UA = navigator.userAgent || "";
  const IS_IOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    (function initScrollPassthrough(){
    if (window === window.parent) return;

    const TARGET_ORIGIN = parentOrigin || "*";

    function postScroll(deltaY, deltaX = 0, source = "") {
      window.parent.postMessage(
        { type: "aiw:scroll", instanceId, deltaY, deltaX, source },
        TARGET_ORIGIN
      );
    }
    function postFling(velocityY) {
      window.parent.postMessage(
        { type: "aiw:fling", instanceId, velocityY },
        TARGET_ORIGIN
      );
    }

    function isScrollable(el) {
      if (!el || el === document || el === window) return false;
      if (el.nodeType !== 1) return false;
      const st = getComputedStyle(el);
      const oy = st.overflowY;
      const ox = st.overflowX;
      const canY = (oy === "auto" || oy === "scroll") && el.scrollHeight > el.clientHeight + 1;
      const canX = (ox === "auto" || ox === "scroll") && el.scrollWidth > el.clientWidth + 1;
      return canY || canX;
    }

    function canScroll(el, dy, dx) {
      if (!el) return false;

      if (dy > 0) { 
        if (el.scrollTop + el.clientHeight < el.scrollHeight - 1) return true;
      } else if (dy < 0) { 
        if (el.scrollTop > 0) return true;
      }

      if (dx > 0) { 
        if (el.scrollLeft + el.clientWidth < el.scrollWidth - 1) return true;
      } else if (dx < 0) { 
        if (el.scrollLeft > 0) return true;
      }

      return false;
    }

    function findScrollableInPath(path) {
      for (const n of path) {
        if (isScrollable(n)) return n;
      }
      return null;
    }

    // Desktop wheel
    window.addEventListener("wheel", (e) => {
      if (e.ctrlKey) return;

      const dx = e.deltaX || 0;
      const dy = e.deltaY || 0;
      const path = e.composedPath ? e.composedPath() : [e.target];
      const sc = findScrollableInPath(path);

      if (!sc || !canScroll(sc, dy, dx)) {
        postScroll(dy, dx, "wheel");
        e.preventDefault();
      }
    }, { passive: false });

// Touch (mobile/tablet) — passthrough + optional lightweight inertia for iOS
let lastX = null, lastY = null;
let lastT = 0;
let vY = 0;
let didPassthrough = false;
let touchScroller = null;
let aiwBody = null;

function getAiwBody() {
  if (aiwBody && document.contains(aiwBody)) return aiwBody;
  const all = document.querySelectorAll("*");
  for (const el of all) {
    if (!el.shadowRoot) continue;
    const b = el.shadowRoot.querySelector(".aiw-body");
    if (b) { aiwBody = b; return b; }
  }
  return null;
}

function pointInside(el, x, y) {
  if (!el) return false;
  const r = el.getBoundingClientRect();
  return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}

function findScrollableByPoint(x, y) {
  const b = getAiwBody();
  if (b && pointInside(b, x, y)) return b;
  return null;
}

window.addEventListener("touchstart", (e) => {
  if (e.touches && e.touches.length === 1) {
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
    lastT = performance.now();
    vY = 0;
    didPassthrough = false;
    const path = e.composedPath ? e.composedPath() : [e.target];
    touchScroller = findScrollableInPath(path) || findScrollableByPoint(lastX, lastY);
  } else {
    lastX = lastY = null;
    lastT = 0;
    vY = 0;
    didPassthrough = false;
    touchScroller = null;
  }
}, { passive: true });

window.addEventListener("touchmove", (e) => {
  if (lastX == null || lastY == null) return;
  if (!e.touches || e.touches.length !== 1) return;

  const x = e.touches[0].clientX;
  const y = e.touches[0].clientY;
  const t = performance.now();

  const dx = (lastX - x);
  const dy = (lastY - y);
  const dt = Math.max(1, t - lastT);
  const instV = dy / dt; // px/ms
  vY = (vY * 0.8) + (instV * 0.2);

  lastX = x;
  lastY = y;
  lastT = t;

  const path = e.composedPath ? e.composedPath() : [e.target];
  const sc = touchScroller || findScrollableInPath(path) || findScrollableByPoint(x, y);

  if (sc && canScroll(sc, dy, dx)) return;

  postScroll(dy, dx, "touch");
  didPassthrough = true;
  e.preventDefault();
}, { passive: false });

window.addEventListener("touchend", () => {
  lastX = lastY = null;
  lastT = 0;
  if (IS_IOS && didPassthrough && Math.abs(vY) > 0.04) {
    const capped = Math.max(-0.8, Math.min(0.8, vY));
    postFling(capped);
  }
  vY = 0;
  didPassthrough = false;
  touchScroller = null;
}, { passive: true });

window.addEventListener("touchcancel", () => {
  lastX = lastY = null;
  lastT = 0;
  vY = 0;
  didPassthrough = false;
  touchScroller = null;
}, { passive: true });
  })();

  // the backend address is taken from the origin if the page is hosted on the same domain
  const host = location.origin;

  // the same config fetch as in the loader.
  const base = host.replace(/\/$/,'');
  const url  = new URL(base + "/api/clients/widget-config");
  if (siteId)   url.searchParams.set("siteId", siteId);
  if (clientId) url.searchParams.set("clientId", clientId);

  (async () => {
    let config = null;
    try {
      const r = await fetch(url.toString(), { method:"GET", credentials:"omit", mode:"cors" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      config = (j && (j.config || j)) || null;
    } catch(e) {
      console.warn("[AIW][frame] config fetch failed:", e);
    }

    const cfg = {
      endpoint: base + "/api/aiw/chat",
      siteId,
      title: (config && (config.widgetTitle || config.title)) || "AI Assistant",
      position: (config && config.position) || "br",
      accent: (config && (config.primaryColor || config.accent)) || "#6D28D9",
      welcome: (config && (config.welcomeMessage || config.welcome)) || "Hi! How can I help?",
      lang: (config && config.lang) || "en",
      backgroundColor: (config && config.backgroundColor) || "#0f0f0f",
      textColor: (config && config.textColor) || "#ffffff",
      borderColor: (config && (config.borderColor || config.primaryColor)) || "#6D28D9",
      logo: (
        config?.logo?.url ||
        config?.logoUrl ||
        (typeof config?.logo === "string" ? config.logo : null)
      ),
      autostart: !!(config && config.autostart),
      autostartDelay: Number(config?.autostartDelay ?? 5000),
      autostartMode: (config?.autostartMode ?? "local").toLowerCase(),
      autostartMessage: (config && config.autostartMessage) || "",
      autostartPrompt: (config && config.autostartPrompt) || "",
      autostartCooldownHours: Number(config?.autostartCooldownHours ?? 12),
      preserveHistory: (config ? config.preserveHistory !== false : true),
      resetHistoryOnOpen: !!(config && config.resetHistoryOnOpen),

       inlineAutostart: config?.inlineAutostart || null,   // ← вот это добавляем
          baseFontSize: (typeof config?.baseFontSize !== "undefined"
                       ? Number(config.baseFontSize)
                       : 15),
        fontFamily:  config?.fontFamily  || "",
      fontCssUrl:  config?.fontCssUrl  || "",
      fontFileUrl: config?.fontFileUrl || "",
        stream: (typeof config?.stream === "boolean") ? config.stream : true,
      mode
    };

    // passing the configuration to the widget
    window.__AIW_CONFIG__ = cfg;

  const resolvedVerRaw =
  (config && (config.resolvedWidgetVersion || config.widgetVersionResolved)) || "";

const resolvedVer = String(resolvedVerRaw).trim();

// A small safety measure: we only allow "normal" versions
const safeVer = /^[0-9A-Za-z._-]{1,32}$/.test(resolvedVer) ? resolvedVer : "";

const primarySrc = safeVer
  ? `${base}/aiw/releases/${encodeURIComponent(safeVer)}/widget.js`
  : "";

const fallbackSrc = `${base}/aiw/widget.js?v=${Date.now()}`;

function loadWithFallback(src, fallback) {
  const js = document.createElement("script");
  js.async = true;
  js.crossOrigin = "anonymous";
  js.src = src;

  js.onerror = () => {
    console.warn("[AIW][frame] failed:", src, "→ fallback:", fallback);
    js.remove();

    const js2 = document.createElement("script");
    js2.async = true;
    js2.crossOrigin = "anonymous";
    js2.src = fallback;
    document.head.appendChild(js2);
  };

  document.head.appendChild(js);
}

if (primarySrc) {
  loadWithFallback(primarySrc, fallbackSrc);
} else {
  // нет версии — сразу грузим fallback
  const js = document.createElement("script");
  js.async = true;
  js.crossOrigin = "anonymous";
  js.src = fallbackSrc;
  document.head.appendChild(js);
}
  })();
})();
</script>
</body>
</html>
