<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AIW Inline</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      width: 100%;
      height: 100%;
      min-height: 100%;
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
  </style>
</head>
<body>
<script>
(function(){
  // читаем query: siteId, clientId, mode
  const p = new URLSearchParams(location.search);
  const siteId   = p.get("siteId") || "";
  const clientId = p.get("clientId") || "";
  const mode     = (p.get("mode") || "inline").toLowerCase();
  const parentOrigin = p.get("parentOrigin") || "*";
  const instanceId   = p.get("instanceId") || "";

    (function initScrollPassthrough(){
    if (window === window.parent) return;

    const TARGET_ORIGIN = parentOrigin || "*";

    function postScroll(deltaY, deltaX = 0) {
      window.parent.postMessage(
        { type: "aiw:scroll", instanceId, deltaY, deltaX },
        TARGET_ORIGIN
      );
    }

    function isScrollable(el) {
      if (!el || el === document || el === window) return false;
      if (el.nodeType !== 1) return false;
      const st = getComputedStyle(el);
      const oy = st.overflowY;
      const ox = st.overflowX;
      const canY = (oy === "auto" || oy === "scroll") && el.scrollHeight > el.clientHeight + 1;
      const canX = (ox === "auto" || ox === "scroll") && el.scrollWidth > el.clientWidth + 1;
      return canY || canX;
    }

    function canScroll(el, dy, dx) {
      if (!el) return false;

      // вертикаль
      if (dy > 0) { // вниз
        if (el.scrollTop + el.clientHeight < el.scrollHeight - 1) return true;
      } else if (dy < 0) { // вверх
        if (el.scrollTop > 0) return true;
      }

      // горизонталь (на всякий)
      if (dx > 0) { // вправо
        if (el.scrollLeft + el.clientWidth < el.scrollWidth - 1) return true;
      } else if (dx < 0) { // влево
        if (el.scrollLeft > 0) return true;
      }

      return false;
    }

    function findScrollableInPath(path) {
      for (const n of path) {
        if (isScrollable(n)) return n;
      }
      return null;
    }

    // Desktop wheel
    window.addEventListener("wheel", (e) => {
      // ctrl+wheel = zoom на тачпаде — не трогаем
      if (e.ctrlKey) return;

      const dx = e.deltaX || 0;
      const dy = e.deltaY || 0;
      const path = e.composedPath ? e.composedPath() : [e.target];
      const sc = findScrollableInPath(path);

      // если скроллить внутри нельзя — пробрасываем наверх
      if (!sc || !canScroll(sc, dy, dx)) {
        postScroll(dy, dx);
        e.preventDefault();
      }
    }, { passive: false });

    // Touch (mobile/tablet)
// Touch (mobile/tablet) — smoother + inertia
let lastX = null, lastY = null;
let lastT = 0;

// накопители для батчинга
let accX = 0, accY = 0;
let rafId = null;

// скорость для "инерции"
let vY = 0;

// настройка "ощущения"
const SCROLL_MULT = 1.15;      // 1.0..1.4 — сделает прокрутку “легче/быстрее”
const V_SMOOTH = 0.85;         // 0.7..0.9 — сглаживание скорости
const FLING_MIN_V = 0.02;      // порог для инерции (px/ms)
const FLING_DECAY = 0.95;      // затухание (0.92..0.97)
const FLING_STOP = 0.5;        // остановка (px/frame)

function flushScroll() {
  rafId = null;
  if (!accX && !accY) return;
  postScroll(accY, accX); // deltaY, deltaX
  accX = 0;
  accY = 0;
}

function scheduleFlush() {
  if (rafId) return;
  rafId = requestAnimationFrame(flushScroll);
}

function startFling() {
  // vY в px/ms → переводим примерно в px/frame (16ms)
  let vy = vY * 16;

  if (Math.abs(vy) < FLING_STOP) return;

  function step() {
    vy *= FLING_DECAY;
    if (Math.abs(vy) < FLING_STOP) return;

    accY += vy;
    scheduleFlush();
    requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}

window.addEventListener("touchstart", (e) => {
  if (e.touches && e.touches.length === 1) {
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
    lastT = performance.now();
    vY = 0;
  } else {
    lastX = lastY = null;
  }
}, { passive: true });

window.addEventListener("touchmove", (e) => {
  if (lastX == null || lastY == null) return;
  if (!e.touches || e.touches.length !== 1) return;

  const x = e.touches[0].clientX;
  const y = e.touches[0].clientY;
  const t = performance.now();

  const dx = (lastX - x) * SCROLL_MULT;
  const dy = (lastY - y) * SCROLL_MULT;

  const dt = Math.max(1, t - lastT);
  const instV = dy / dt;            // px/ms
  vY = vY * V_SMOOTH + instV * (1 - V_SMOOTH);

  lastX = x;
  lastY = y;
  lastT = t;

  const path = e.composedPath ? e.composedPath() : [e.target];
  const sc = findScrollableInPath(path);

  if (!sc || !canScroll(sc, dy, dx)) {
    accY += dy;
    accX += dx;
    scheduleFlush();
    e.preventDefault();
  }
}, { passive: false });

window.addEventListener("touchend", () => {
  lastX = lastY = null;

  // “инерция” только если жест был достаточно быстрым
  if (Math.abs(vY) > FLING_MIN_V) {
    startFling();
  }
}, { passive: true });
  })();

  // адрес бэкенда берём из origin, если страница хостится на том же домене
  const host = location.origin;

  // тот же феч конфига, что и в loader
  const base = host.replace(/\/$/,'');
  const url  = new URL(base + "/api/clients/widget-config");
  if (siteId)   url.searchParams.set("siteId", siteId);
  if (clientId) url.searchParams.set("clientId", clientId);

  (async () => {
    let config = null;
    try {
      const r = await fetch(url.toString(), { method:"GET", credentials:"omit", mode:"cors" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      config = (j && (j.config || j)) || null;
    } catch(e) {
      console.warn("[AIW][frame] config fetch failed:", e);
    }

    const cfg = {
      endpoint: base + "/api/aiw/chat",
      siteId,
      title: (config && (config.widgetTitle || config.title)) || "AI Assistant",
      position: (config && config.position) || "br",
      accent: (config && (config.primaryColor || config.accent)) || "#6D28D9",
      welcome: (config && (config.welcomeMessage || config.welcome)) || "Hi! How can I help?",
      lang: (config && config.lang) || "en",
      backgroundColor: (config && config.backgroundColor) || "#0f0f0f",
      textColor: (config && config.textColor) || "#ffffff",
      borderColor: (config && (config.borderColor || config.primaryColor)) || "#6D28D9",
      logo: (
        config?.logo?.url ||
        config?.logoUrl ||
        (typeof config?.logo === "string" ? config.logo : null)
      ),
      autostart: !!(config && config.autostart),
      autostartDelay: Number(config?.autostartDelay ?? 5000),
      autostartMode: (config?.autostartMode ?? "local").toLowerCase(),
      autostartMessage: (config && config.autostartMessage) || "",
      autostartPrompt: (config && config.autostartPrompt) || "",
      autostartCooldownHours: Number(config?.autostartCooldownHours ?? 12),
      preserveHistory: (config ? config.preserveHistory !== false : true),
      resetHistoryOnOpen: !!(config && config.resetHistoryOnOpen),

       inlineAutostart: config?.inlineAutostart || null,   // ← вот это добавляем
          baseFontSize: (typeof config?.baseFontSize !== "undefined"
                       ? Number(config.baseFontSize)
                       : 15),
        fontFamily:  config?.fontFamily  || "",
      fontCssUrl:  config?.fontCssUrl  || "",
      fontFileUrl: config?.fontFileUrl || "",
        stream: (typeof config?.stream === "boolean") ? config.stream : true,
      // ▼ NEW: подсказка виджету, что он рендерится внутри iframe как inline
      mode
    };

    // отдаём конфиг виджету
    window.__AIW_CONFIG__ = cfg;

    // подключаем тот же widget.js
    const js = document.createElement("script");
    js.src = base + "/aiw/widget.js?v=" + Date.now();
    js.async = true;
    js.crossOrigin = "anonymous";
    document.head.appendChild(js);
  })();
})();
</script>
</body>
</html>
