<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compliance Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    .header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: #111111;
      letter-spacing: -0.01em;
    }

    .header-sub {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }

    .body {
      padding: 14px 18px 16px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 9px 14px;
      background: #111111;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }

    .btn:hover { background: #374151; }

    .status {
      margin-top: 10px;
      font-size: 11px;
      color: #6b7280;
      text-align: center;
      min-height: 16px;
    }

    .status.error { color: #b42318; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">Compliance Assistant</div>
    <div class="header-sub">Open on the current page</div>
  </div>
  <div class="body">
    <button class="btn" id="openBtn">Open Assistant</button>
    <div class="status" id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
