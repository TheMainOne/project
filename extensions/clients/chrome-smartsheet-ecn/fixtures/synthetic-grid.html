<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Synthetic ECN Sheet - Smartsheet</title></head>
  <body>
    <h1 role="heading">Synthetic ECN Sheet</h1>
    <main id="fixture-root">
      <div role="grid" aria-label="ECN requests" aria-rowcount="4" aria-colcount="5">
        <div role="row" aria-rowindex="1" id="headers">
          <div id="h1" role="columnheader" aria-colindex="1">ECN Number</div>
          <div id="h2" role="columnheader" aria-colindex="2">Status</div>
          <div id="h3" role="columnheader" aria-colindex="3">Requested By</div>
          <div id="h4" role="columnheader" aria-colindex="4">Change Type</div>
          <div id="h5" role="columnheader" aria-colindex="5" hidden>Hidden Internal Column</div>
        </div>
        <div role="row" aria-rowindex="2" id="row-2">
          <div role="gridcell" tabindex="0" aria-rowindex="2" aria-colindex="1" aria-labelledby="h1">ECN-1001</div>
          <div role="gridcell" aria-rowindex="2" aria-colindex="2" aria-labelledby="h2">Submitted</div>
        </div>
        <div role="row" aria-rowindex="3" id="row-3">
          <div role="gridcell" tabindex="0" aria-rowindex="3" aria-colindex="1" aria-labelledby="h1">ECN-1002</div>
          <div role="gridcell" aria-rowindex="3" aria-colindex="2" aria-labelledby="h2">MDC Validation</div>
          <div role="gridcell" aria-rowindex="3" aria-colindex="3" aria-labelledby="h3">requestor@example.test</div>
          <div role="gridcell" aria-rowindex="3" aria-colindex="4" aria-labelledby="h4">QA Block</div>
        </div>
      </div>
    </main>
  </body>
</html>
